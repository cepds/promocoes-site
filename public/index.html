<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Radar" />
  <title>Radar de Promoções</title>
  <meta name="description" content="Produtos com preço e estoque confirmados recentemente nas lojas. Itens esgotados ou sem confirmação são removidos da vitrine." />
  <meta property="og:title" content="Radar de Promoções" />
  <meta property="og:description" content="Compare preço, frete, histórico e confiança da loja em um só lugar." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://promocoes-65707.web.app/" />
  <link rel="canonical" href="https://promocoes-65707.web.app/" />
  <meta name="robots" content="index,follow" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./style.css?v=16" />
  <link rel="stylesheet" href="./enhancements.css?v=2" />
</head>
<body>
  <main>
    <section class="container discovery" aria-label="Filtros de produtos">
      <div class="search-panel">
        <div class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
          <input id="search" type="search" placeholder="Buscar produto, categoria ou loja…" autocomplete="off" />
        </div>

        <div class="filter-row primary-filters">
          <label><span>Categoria</span><select id="category"><option value="">Todas as categorias</option></select></label>
          <label><span>Loja</span><select id="store"><option value="">Todas as lojas</option></select></label>
          <label><span>Ordenar</span><select id="sort">
            <option value="newest">Mais recentes</option>
            <option value="score">Melhor oferta</option>
            <option value="discount">Maior desconto</option>
            <option value="totalAsc">Menor total com frete</option>
            <option value="priceAsc">Menor preço</option>
            <option value="priceDesc">Maior preço</option>
          </select></label>
        </div>

        <div class="advanced-filters">
          <label><span>Preço mín.</span><input id="minPrice" type="number" min="0" step="50" placeholder="R$ 0" /></label>
          <label><span>Preço máx.</span><input id="maxPrice" type="number" min="0" step="50" placeholder="Sem limite" /></label>
          <label><span>Desconto mín.</span><select id="minDiscount">
            <option value="0">Qualquer</option><option value="10">10%+</option><option value="20">20%+</option><option value="30">30%+</option><option value="40">40%+</option>
          </select></label>
          <label class="check-filter"><input id="freeShipping" type="checkbox" /><span>Frete grátis</span></label>
          <button id="clearFilters" class="clear-filter" type="button">Limpar filtros</button>
        </div>
        <div class="filter-shortcuts" aria-label="Ações dos produtos">
          <button id="favoritesToggle" type="button" class="filter-shortcut">♡ Favoritos <span id="favoritesCount">0</span></button>
          <button id="compareToggle" type="button" class="filter-shortcut">⇄ Comparar <span id="compareCount">0</span></button>
        </div>
      </div>
      <div class="category-strip-wrap"><div class="category-strip" id="categoryChips" aria-label="Categorias"></div></div>
    </section>

    <section class="container offers-section">
      <div class="section-heading">
        <div><h2>Produtos</h2></div>
        <div class="section-meta"><strong id="count">0 ofertas</strong><span id="updated"></span></div>
      </div>
      <section id="offers" class="grid"></section>
      <section id="empty" class="state-card hidden"><div class="state-icon">⌕</div><h3>Nenhum produto encontrado</h3><p>Tente outro termo ou remova algum filtro.</p></section>
      <section id="error" class="state-card hidden"><div class="state-icon">!</div><h3>Não foi possível carregar os produtos</h3><p id="errorMessage"></p></section>
    </section>
  </main>

  <aside id="comparePanel" class="drawer hidden" aria-label="Comparação de produtos">
    <div class="drawer-backdrop" data-close-compare></div>
    <div class="drawer-card">
      <div class="drawer-head"><div><strong>Comparar produtos</strong><small>Selecione até 3</small></div><button type="button" class="icon-button" data-close-compare>×</button></div>
      <div id="compareContent" class="compare-content"></div>
      <button id="clearCompare" class="secondary-button" type="button">Limpar comparação</button>
    </div>
  </aside>

  <script src="./catalog-policy.js?v=4"></script>
  <script src="./search-engine.js?v=1"></script>
  <script src="./product-identity.js?v=1"></script>
  <script src="./app.js?v=18"></script>
  <script src="./auto-refresh.js?v=1"></script>
  <script src="./enhancements.js?v=4"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(registration => registration.update()).catch(console.warn);
      });
    }
  </script>
</body>
</html>
