name: Enriquecer catálogo agora

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enrich-data-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inicializar histórico, score, selos e log
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/ofertas.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const now = new Date().toISOString();
          const offers = Array.isArray(data.ofertas) ? data.ofertas : [];

          function num(v) {
            const n = Number(v);
            return Number.isFinite(n) ? n : null;
          }
          function label(score) {
            return score >= 75 ? 'Excelente' : score >= 58 ? 'Boa' : score >= 42 ? 'Interessante' : 'Normal';
          }
          function inferStoreBadge(o) {
            const s = `${o.loja || ''} ${o.observacoes || ''}`.toLowerCase();
            if (s.includes('vendido pela amazon')) return 'Vendido pela Amazon';
            if (s.includes('shopee mall')) return 'Shopee Mall';
            if (s.includes('aliexpress choice') || /\bchoice\b/.test(s)) return 'AliExpress Choice';
            if (s.includes('mercadolíder') || s.includes('mercadolider')) return 'MercadoLíder';
            if (s.includes('loja oficial') || s.includes('oficial no magalu') || s.includes('oficial mercado livre')) return 'Loja Oficial';
            return o.seloLoja || '';
          }

          for (const o of offers) {
            const price = num(o.precoAtual);
            const freight = num(o.freteValor);
            const total = num(o.precoComFrete) ?? (price !== null && freight !== null ? +(price + freight).toFixed(2) : null);
            const hist = Array.isArray(o.historicoPrecos) ? o.historicoPrecos.filter(x => num(x?.preco) !== null) : [];
            if (price !== null && !hist.length) {
              hist.push({ data: o.ultimaVerificacao || now, preco: price, freteValor: freight, precoComFrete: total });
            }
            o.historicoPrecos = hist.slice(-60);
            const prices = o.historicoPrecos.map(x => num(x.preco)).filter(v => v !== null);
            if (price !== null && !prices.length) prices.push(price);
            if (prices.length) {
              o.menorPrecoHistorico = +Math.min(...prices).toFixed(2);
              o.precoMedioHistorico = +(prices.reduce((a,b) => a+b, 0) / prices.length).toFixed(2);
            }

            const badge = inferStoreBadge(o);
            if (badge) o.seloLoja = badge;

            const discount = Math.max(0, Math.min(50, num(o.desconto) || 0));
            let historyPts = 8;
            if (price !== null && o.menorPrecoHistorico) {
              const above = ((price - o.menorPrecoHistorico) / o.menorPrecoHistorico) * 100;
              historyPts = above <= 1 ? 30 : above <= 5 ? 24 : above <= 10 ? 15 : 6;
            }
            const free = o.freteGratis === true || /gr[aá]tis/i.test(String(o.frete || ''));
            const shipPts = free ? 12 : freight !== null ? 6 : 2;
            const trustPts = badge ? 8 : 3;
            const score = Math.round(Math.min(100, discount + historyPts + shipPts + trustPts));
            o.scoreOferta = score;
            o.classificacaoOferta = label(score);
            if (!Object.prototype.hasOwnProperty.call(o, 'variacaoPreco')) o.variacaoPreco = null;
            if (!Object.prototype.hasOwnProperty.call(o, 'ultimaQuedaPreco')) o.ultimaQuedaPreco = null;
          }

          data.geradoEm = now;
          data.total = offers.filter(o => o.ativa !== false).length;
          if (!Array.isArray(data.logAlteracoes)) data.logAlteracoes = [];
          data.logAlteracoes = data.logAlteracoes.slice(-200);
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE
      - name: Salvar atualização no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ofertas.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "data: inicializar histórico e score das ofertas"
            git push
          fi
