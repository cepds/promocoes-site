name: Firebase Hosting Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/validate-site.js'
      - 'tests/**'
      - '.github/workflows/firebase-hosting.yml'

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

permissions:
  contents: read

env:
  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROMOCOES_65707 }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate catalog and frontend
        run: |
          node scripts/validate-site.js
          node --test tests/*.test.js
          node scripts/audit-catalog.js

      - name: Verify Firebase deploy credentials
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_PROMOCOES_65707 ausente. Deploy nao executado."
            exit 1
          fi

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROMOCOES_65707 }}
          channelId: live
          projectId: promocoes-65707
          # 15.34.1 passou a exigir serviceusage.services.get; versão 15.34.0 funcionou.
          firebaseToolsVersion: '15.34.0'
