name: Enriquecer comercio agora

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enriquecer e criar backup
        run: node scripts/enrich-commerce-once.js
      - name: Validar JSON
        run: node -e "JSON.parse(require('fs').readFileSync('data/ofertas.json','utf8')); console.log('JSON válido')"
      - name: Validar catálogo antes do commit
        run: |
          node scripts/validate-site.js --audit
          node --test tests/*.test.js
      - name: Commitar backup e catálogo
        run: |
          if git diff --quiet -- data/ofertas.json data/backups; then
            echo "Sem alterações para commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ofertas.json data/backups
          git commit -m "Enrich commerce metadata and snapshot catalog"
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              echo '::error::Conflito ao integrar atualizações simultâneas; nenhuma sobrescrita forçada.'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo '::error::Publicação concorrente impediu o envio após 5 tentativas.'
          exit 1
