name: Enriquecer catalogo
on:
  push:
    branches: [main]
    paths:
      - 'scripts/enrich_catalog.py'
      - '.github/workflows/enrich-catalog-run.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/enrich_catalog.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'data: enriquecer catalogo'
          file_pattern: data/ofertas.json
