name: Catalog automation runner
on:
  push:
    paths:
      - 'scripts/automation-run.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run catalog automation
        run: node scripts/automation-run.js
      - name: Commit catalog changes
        shell: bash
        run: |
          if git diff --quiet -- data/ofertas.json data/backups; then
            echo 'No catalog changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ofertas.json data/backups
          git commit -m 'chore: refresh promotion catalog'
          git push
