name: Catalog automation runner
on:
  push:
    paths:
      - 'scripts/automation-run.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run catalog automation
        run: node scripts/automation-run.js
      - name: Validar catálogo antes do commit
        run: |
          node scripts/validate-site.js --audit
          node --test tests/*.test.js
      - name: Commit catalog changes
        shell: bash
        run: |
          if git diff --quiet -- data/ofertas.json data/backups; then
            echo 'No catalog changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ofertas.json data/backups
          git commit -m 'chore: refresh promotion catalog'
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              echo '::error::Conflito ao integrar atualizações simultâneas; nenhuma sobrescrita forçada.'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo '::error::Publicação concorrente impediu o envio após 5 tentativas.'
          exit 1
