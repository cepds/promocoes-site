name: Catalog batch safe update

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-validated-batch.js'
      - '.github/workflows/catalog-batch-run.yml'

permissions:
  contents: write

concurrency:
  group: catalog-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Atualizar catálogo validado
        run: node scripts/add-validated-batch.js
      - name: Validar catálogo antes de salvar
        run: node scripts/validate-site.js
      - name: Commit com proteção contra concorrência
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ofertas.json
          if git diff --cached --quiet; then
            echo "Sem mudanças para salvar."
            exit 0
          fi
          git commit -m "data: completar máquinas de lavar 220V"
          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((tentativa * 3))
          done
          echo "Não foi possível salvar após 5 tentativas."
          exit 1
