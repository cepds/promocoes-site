name: Atualizar catálogo agora

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-now.js'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/update-now.js
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/ofertas.json
          git diff --cached --quiet || git commit -m "data: adicionar ofertas validadas"
          git push
